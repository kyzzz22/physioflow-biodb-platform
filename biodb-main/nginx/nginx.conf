worker_processes auto;

events {
    worker_connections 1024;  # 最大接続数
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 80;

        location /WebUI/ {
            root /usr/share/nginx/html;
            index index.html;
            # SvelteKit 输出为扁平 xxx.html（console/login/participants 等），
            # 支持无扩展名访问：/WebUI/console → console.html
            try_files $uri $uri/ $uri.html /WebUI/index.html;
            charset utf-8;
        }

        # util 可视化客户端（NGINX 静态分发 + CSR 绘图）
        location /util/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /util/index.html;
            charset utf-8;
        }

        # BioDB Console 统一管理界面（概览/浏览/事件/分析/导出）
        location /db/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /db/index.html;
            charset utf-8;
        }

        # flasgger Swagger UI 尾部斜杠规范化(保留端口)
        location = /auth/apidocs { return 308 $scheme://$http_host/auth/apidocs/; }
        location = /sensor/apidocs { return 308 $scheme://$http_host/sensor/apidocs/; }
        location = /event/apidocs { return 308 $scheme://$http_host/event/apidocs/; }

        # 認証サーバへのルーティング
        location /auth/ {
            proxy_pass http://auth:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /auth/;
        }
        location /auth/apispec_1.json {
            proxy_pass http://auth:8000/auth/apispec_1.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /auth/flasgger_static/ {
            proxy_pass http://auth:8000/auth/flasgger_static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 実験レジストリ API（auth サーバ）: bio_console 実験登録用
        location /experiments {
            proxy_pass http://auth:8000/experiments;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /experiment {
            proxy_pass http://auth:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # センサデータ受付サーバへのルーティング
        location /sensor/ {
            proxy_pass http://sensor:8001/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /sensor/;
        }
        location /sensor/apispec_1.json {
            proxy_pass http://sensor:8001/sensor/apispec_1.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /sensor/flasgger_static/ {
            proxy_pass http://sensor:8001/sensor/flasgger_static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # イベントデータサーバへのルーティング
        location /event/ {
            proxy_pass http://event:8002/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /event/;
        }
        location /event/apispec_1.json {
            proxy_pass http://event:8002/event/apispec_1.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /event/flasgger_static/ {
            proxy_pass http://event:8002/event/flasgger_static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
