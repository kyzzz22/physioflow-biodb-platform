x-api: &api
  env_file: .env
  environment:
    POSTGRES_USER: soma
    POSTGRES_PASSWORD: testtest
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MONGO_USER: root
    MONGO_PASSWORD: testtest
    MONGO_HOST: mongo
    MONGO_PORT: "27017"
    VICTORIA_METRICS_HOST: http://victoria:8428
    VICTORIA_METRICS_EXPORT_PATH: /api/v1/export
    VICTORIA_METRICS_WRITE_PATH: /write
    VICTORIA_METRICS_BASE_METRIC_NAME: biodb

services:
  postgres:
    build: ./postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: soma
      POSTGRES_PASSWORD: testtest
      POSTGRES_DB: biodb
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=postgres
    volumes:
      - ./postgresql/db_vol:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0.16
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: testtest
    volumes:
      - ./mongodb/data/configdb:/data/configdb
      - ./mongodb/data/db:/data/db

  victoria:
    image: victoriametrics/victoria-metrics:v1.116.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=100y
    volumes:
      - ./victoria_metrics/vm_data:/storage

  auth:
    build:
      context: ./bio_api_server
      dockerfile: Dockerfile.auth
    restart: unless-stopped
    <<: *api
    depends_on:
      - postgres
      - mongo

  sensor:
    build:
      context: ./bio_api_server
      dockerfile: Dockerfile.sensor_victoria
    restart: unless-stopped
    <<: *api
    depends_on:
      - victoria

  event:
    build:
      context: ./bio_api_server
      dockerfile: Dockerfile.event
    restart: unless-stopped
    <<: *api
    depends_on:
      - mongo

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    restart: unless-stopped
    ports:
      - "5002:80"
    depends_on:
      - auth
      - sensor
      - event

  admin:
    profiles: [tools]
    build:
      context: ./bio_api_server
      dockerfile: Dockerfile.admin
    <<: *api
    depends_on:
      - postgres
